name: Compilar APK de Android

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar el código del repositorio
      uses: actions/checkout@v4

    - name: Configurar Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Crear archivos base de Gradle faltantes
      run: |
        echo 'include(":app")' > settings.gradle.kts
        echo 'plugins { id("com.android.application") version "8.2.0" apply false; id("org.jetbrains.kotlin.android") version "1.9.0" apply false }' > build.gradle.kts

    - name: Crear instalador Gradle temporal
      run: |
        gradle wrapper --gradle-version 8.2
        chmod +x gradlew

    - name: Compilar la aplicación (Generar APK)
      run: ./gradlew :app:assembleDebug

    - name: Subir el APK resultante para descargar
      uses: actions/upload-artifact@v4
      with:
        name: MiAppPrueba-Digital
        path: app/build/outputs/apk/debug/app-debug.apk
        
